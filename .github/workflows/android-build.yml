name: Android build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Inject google-services.json (optional)
        shell: bash
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > kAIros/app/google-services.json


      - name: Grant execute permission for Gradle
        working-directory: kAIros
        run: chmod +x ./gradlew

      - name: Assemble Debug
        working-directory: kAIros
        run: ./gradlew assembleDebug

      - name: Unit tests
        working-directory: kAIros
        run: ./gradlew testDebugUnitTest
